<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1D3A"/>
      <stop offset="100%" stop-color="#060D1C"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C46D"/>
      <stop offset="100%" stop-color="#C88D2E"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="14" y="14" width="228" height="228" rx="44" fill="none" stroke="url(#brass)" stroke-width="3" opacity="0.45"/>
  <!-- 2x2 Radar Grid + Check / Shield Emblem -->
  <rect x="44" y="44" width="74" height="58" rx="14" fill="#13274C" stroke="#D9A54A" stroke-width="3"/>
  <rect x="138" y="44" width="74" height="58" rx="14" fill="#13274C" stroke="#4F8FD6" stroke-width="2.5" opacity="0.85"/>
  <rect x="44" y="116" width="74" height="58" rx="14" fill="#13274C" stroke="#10B981" stroke-width="2.5" opacity="0.85"/>
  <rect x="138" y="116" width="74" height="58" rx="14" fill="#13274C" stroke="#D9A54A" stroke-width="2.5" opacity="0.85"/>
  <!-- Checkmark inside top-left Radar tile -->
  <path d="M66 73l11 11 22-22" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Timer inside top-right tile -->
