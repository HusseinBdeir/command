<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2143"/>
      <stop offset="100%" stop-color="#071124"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6D07C"/>
      <stop offset="100%" stop-color="#C68827"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="100%" stop-color="#EAE5DC"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17315E"/>
      <stop offset="100%" stop-color="#0E2040"/>
    </linearGradient>
  </defs>

  <!-- Outer App Icon Squircle Plate -->
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="11" y="11" width="234" height="234" rx="44" fill="none" stroke="url(#brass)" stroke-width="2.5" opacity="0.48"/>

  <!-- 1. TOP-LEFT TILE: PLANNING & BENTO STRUCTURE (Warm Paper Hero Tile) -->
  <rect x="30" y="28" width="90" height="76" rx="18" fill="url(#paper)" stroke="#D9A54A" stroke-width="3"/>
  <!-- Bold Emerald Check + Structured Plan Bars -->
  <path d="M44 52l8 8 15-16" fill="none" stroke="#059669" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="74" y="46" width="32" height="8" rx="4" fill="#0B1730"/>
  <rect x="44" y="69" width="62" height="8" rx="4" fill="#0B1730" opacity="0.88"/>
  <rect x="44" y="83" width="42" height="7" rx="3.5" fill="#C68827"/>

  <!-- 2. TOP-RIGHT TILE: DELEGATION & TEAM DISPATCH (Luminous Brass Hero Tile) -->
  <rect x="136" y="28" width="90" height="76" rx="18" fill="url(#brass)" stroke="#FDE68A" stroke-width="2.5"/>
  <!-- Person Silhouette + Bold Dispatch Arrow (↗) -->
  <circle cx="165" cy="54" r="10.5" fill="#0B1730"/>
  <path d="M147 88c0-10.5 8-18 18-18s18 7.5 18 18" fill="#0B1730"/>
  <path d="M190 68l22-22M194 46h18v18" fill="none" stroke="#0B1730" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. BOTTOM-LEFT TILE: SMART TASKS & WAIT TIMERS -->
  <rect x="30" y="116" width="90" height="76" rx="18" fill="url(#tileDark)" stroke="#60A5FA" stroke-width="3.2"/>
  <!-- Precision Timer / Clock -->
  <line x1="67" y1="127" x2="83" y2="127" stroke="#F6D07C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="75" cy="157" r="22" fill="none" stroke="#F4F2EE" stroke-width="6"/>
  <path d="M75 144v13l10 6" fill="none" stroke="#F6D07C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. BOTTOM-RIGHT TILE: THE 100% SCORE SHIELD & PRAYER CRESCENT -->
  <rect x="136" y="116" width="90" height="76" rx="18" fill="url(#tileDark)" stroke="#34D399" stroke-width="3.2"/>
  <!-- Discipline Shield (Left) -->
  <path d="M164 131l17 6.5v13.5c0 12.5-7.4 20.6-17 24.5-9.6-3.9-17-12-17-24.5v-13.5l17-6.5z" fill="#10B981" stroke="#F4F2EE" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M157 153l5 5 10-10" fill="none" stroke="#071124" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shia Prayer Crescent (Right) -->
  <path d="M207 136a16 16 0 1 0 10 28.5 13.5 13.5 0 1 1-10-28.5z" fill="url(#brass)"/>

  <!-- BHFIRMS Signature Accountant's Brass Double Rule -->
  <rect x="30" y="205" width="196" height="6.5" rx="3.25" fill="url(#brass)"/>
  <rect x="30" y="217" width="196" height="3.5" rx="1.75" fill="url(#brass)" opacity="0.82"/>
</svg>
