<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Planner">
  <defs>
    <!-- Deep Architectural Obsidian-Navy Squircle Background (matches Fitness & THEO) -->
    <radialGradient id="bgPlate" cx="48%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#162E58"/>
      <stop offset="55%" stop-color="#0B1730"/>
      <stop offset="100%" stop-color="#050B18"/>
    </radialGradient>

    <!-- Subtle Ambient Glow behind the Planner Card -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#EAB308" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0B1730" stop-opacity="0"/>
    </radialGradient>

    <!-- Tactile Warm-Ivory Paper Card Surface -->
    <linearGradient id="cardPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Executive Liquid-Brass Planner Header Crown -->
    <linearGradient id="brassHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="38%" stop-color="#F59E0B"/>
      <stop offset="78%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Sculpted Silver-Ivory Binder Clasp Gradient -->
    <linearGradient id="lugMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Emerald Completion Gradient -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Sky-Blue Timeline Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Dynamic Delegation & Action Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Clip Path for the Rounded Planner Card -->
    <clipPath id="cardClip">
      <rect x="76" y="92" width="316" height="328" rx="66"/>
    </clipPath>
  </defs>

  <!-- 1. App Store Squircle Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgPlate)"/>
  <circle cx="256" cy="252" r="224" fill="url(#ambientGlow)"/>

  <!-- 2. Layered Depth Shadow Stack beneath the Planner Sheet -->
  <rect x="92" y="114" width="316" height="328" rx="66" fill="#030712" fill-opacity="0.58"/>
  <rect x="84" y="104" width="316" height="328" rx="66" fill="#1E293B" fill-opacity="0.48"/>

  <!-- 3. Main Sculpted Planner Card (Clipped for Header + Body) -->
  <g clip-path="url(#cardClip)">
    <!-- Warm Paper Body -->
    <rect x="76" y="92" width="316" height="328" fill="url(#cardPaper)"/>

    <!-- Liquid-Brass Top Header Crown -->
    <rect x="76" y="92" width="316" height="88" fill="url(#brassHeader)"/>
    <!-- Subtle Inner Bevel on Crown -->
    <rect x="76" y="176" width="316" height="4" fill="#78350F" fill-opacity="0.28"/>
  </g>

  <!-- Planner Card Outer Specular Rim -->
  <rect x="76" y="92" width="316" height="328" rx="66" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="3"/>

  <!-- 4. Sculpted Metallic Calendar/Planner Binding Rings (Cleanly Anchored in Grommets) -->
  <!-- Left Grommet + Clasp -->
  <circle cx="164" cy="128" r="15" fill="#78350F" fill-opacity="0.45"/>
  <rect x="152" y="64" width="24" height="66" rx="12" fill="url(#lugMetal)" stroke="#0F172A" stroke-opacity="0.22" stroke-width="2"/>
  <!-- Right Grommet + Clasp -->
  <circle cx="304" cy="128" r="15" fill="#78350F" fill-opacity="0.45"/>
  <rect x="292" y="64" width="24" height="66" rx="12" fill="url(#lugMetal)" stroke="#0F172A" stroke-opacity="0.22" stroke-width="2"/>

  <!-- 5. Inside the Planner Card: 3 Bold Priority & Timeline Rows -->
  <!-- Row 1: Completed / Priority Plan Item (Emerald Check + Bold Navy Bar) -->
  <circle cx="138" cy="226" r="23" fill="url(#emeraldGrad)"/>
  <path d="M 126.5 226.5 L 135 235 L 150.5 218.5" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="180" y="213" width="168" height="26" rx="13" fill="#0F172A"/>

  <!-- Row 2: Active / Delegated Priority Item (Liquid-Brass Node + Structured Bar) -->
  <circle cx="138" cy="296" r="23" fill="url(#brassHeader)"/>
  <circle cx="138" cy="296" r="9" fill="#FFFFFF"/>
  <rect x="180" y="283" width="136" height="26" rx="13" fill="#1E293B"/>

  <!-- Row 3: Scheduled / Time-Blocked Item (Sky-Blue Node + Short Bar) -->
  <circle cx="138" cy="366" r="23" fill="url(#skyGrad)"/>
  <circle cx="138" cy="366" r="9" fill="#FFFFFF"/>
  <rect x="180" y="353" width="94" height="26" rx="13" fill="#475569"/>

  <!-- 6. Overlapping Bottom-Right Forward-Dispatch / Delegation Badge -->
  <!-- Dark Navy Cutout Halo so the badge pops cleanly off the white card corner -->
  <circle cx="368" cy="368" r="88" fill="#0B1730"/>
  <!-- Outer Liquid-Brass Precision Ring + Emerald Action Core -->
  <circle cx="368" cy="368" r="76" fill="url(#badgeGrad)" stroke="url(#brassHeader)" stroke-width="8.5"/>
  <!-- Bold White Forward Dispatch Arrow (↗) — Execution & Delegation -->
  <path d="M 336 400 L 396 340" fill="none" stroke="#FFFFFF" stroke-width="18.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 348 340 L 396 340 L 396 388" fill="none" stroke="#FFFFFF" stroke-width="18.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
