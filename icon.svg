  <!-- Sunk Track Grooves -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#D9A54A" stroke-opacity="0.16" stroke-width="24"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="#10B981" stroke-opacity="0.16" stroke-width="20"/>

