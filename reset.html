<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planner — Reset Cache</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F8F6F1;
      color: #0F172A;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      padding: 28px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1px solid rgba(181, 123, 30, 0.35);
    }
    h1 { font-size: 18px; margin: 0 0 8px; color: #B57B1E; }
    p { font-size: 13px; color: #64748B; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resetting Planner Cache…</h1>
    <p id="msg">Unregistering service workers and clearing local caches.</p>
  </div>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
      } catch (e) {}
      document.getElementById('msg').textContent = 'Cache cleared. Redirecting to Planner…';
      setTimeout(() => location.replace('./?reset=' + Date.now()), 500);
    })();
  </script>
</body>
</html>
