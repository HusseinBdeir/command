<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#F4F2EE" id="meta-theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <meta name="description" content="Planner — Executive Planning, Horizon Agenda, BHFIRMS Delegation &amp; Accountability, Daily 100% Score &amp; Shia Prayer Times.">
  <title>Planner — Executive Planning, Delegation, Tasks, Score &amp; Prayer Times</title>
  <link rel="manifest" href="manifest.json?v=17">
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=17">
  <link rel="apple-touch-icon" href="icon-180.png?v=17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/command.css?v=17">
  <script id="pre">
    (() => {
      try {
        const d = document.documentElement;
        const t = localStorage.getItem('theo_cmd_theme_v2') === 'dark' ? 'dark' : 'light';
        d.setAttribute('data-theme', t);
        const m = document.getElementById('meta-theme-color');
        if (m) m.setAttribute('content', t === 'light' ? '#F4F2EE' : '#081121');
        if ((window.navigator && window.navigator.standalone) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) {
          d.classList.add('ios-standalone');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- ISOLATED STAFF DELEGATION PORTAL (Only shown when opened with ?task=...&token=...) -->
  <div id="staff-portal-root" class="staff-portal-root" hidden></div>

  <!-- EXECUTIVE OWNER APP SHELL -->
  <div id="owner-app-shell" class="cmd-shell">
    <!-- Architectural Rev 10 Top HUD Ribbon -->
    <header class="hud-ribbon" id="hud-ribbon">
      <div class="hud-left">
        <img src="icon.svg?v=17" alt="Planner" class="hud-logo">
        <div class="hud-brand-copy">
          <div class="hud-brand-row">
            <span class="hud-brand-name">PLANNER</span>
            <span class="hud-brand-tag">BHFIRMS</span>
          </div>
          <span class="brass-double-rule"></span>
        </div>
        <button type="button" class="hud-score-pill" id="hud-score-btn" title="Open The Score (100-Point Executive Discipline Ledger)">
          <svg class="hud-shield-svg" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"><path d="M9 2L14.5 4.2V8.6C14.5 12.2 12.1 14.7 9 16C5.9 14.7 3.5 12.2 3.5 8.6V4.2L9 2Z"/><path d="M6.6 9.1L8.3 10.8L11.6 7.4" stroke-linecap="round"/></svg>
          <strong class="hud-score-val tabular" id="hud-score-val">50%</strong>
          <span class="hud-score-delta tabular" id="hud-score-delta">50% +0%</span>
        </button>
      </div>

      <!-- Integrated Desktop Command Navigation Deck (Shown on >= 980px) -->
      <nav class="hud-desktop-nav" id="hud-desktop-nav" aria-label="Executive Workspace Navigation">
        <button type="button" class="hud-nav-btn active" data-tab="planning">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.2" y="2.2" width="5.6" height="5.6" rx="1.2"/><rect x="10.2" y="2.2" width="5.6" height="5.6" rx="1.2"/><rect x="2.2" y="10.2" width="5.6" height="5.6" rx="1.2"/><rect x="10.2" y="10.2" width="5.6" height="5.6" rx="1.2"/></svg>
          <span>Planning</span>
          <span class="hud-nav-badge brass tabular" id="top-badge-planning" hidden>0</span>
        </button>
        <button type="button" class="hud-nav-btn" data-tab="delegated">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6.8" cy="5.8" r="2.5"/><path d="M2.2 14.5c0-2.3 2-4 4.6-4s4.6 1.7 4.6 4"/><circle cx="13" cy="6.4" r="2"/><path d="M12.4 10.6c2 .3 3.5 1.6 3.5 3.6"/></svg>
          <span>Delegation</span>
          <span class="hud-nav-badge emerald tabular" id="top-badge-delegated" hidden>0</span>
        </button>
        <button type="button" class="hud-nav-btn" data-tab="tasks">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9.5" r="6.2"/><path d="M9 6v3.6l2.4 1.6M6.8 2h4.4"/></svg>
          <span>Tasks &amp; Holds</span>
          <span class="hud-nav-badge amber tabular" id="top-badge-tasks" hidden>0</span>
        </button>
        <button type="button" class="hud-nav-btn" data-tab="score">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 2l5.4 2.2v4.3c0 3.8-2.3 6.2-5.4 7.5-3.1-1.3-5.4-3.7-5.4-7.5V4.2L9 2z"/><path d="M6.5 9.2l1.7 1.7 3.3-3.4" stroke-linecap="round"/></svg>
          <span>The Score</span>
          <span class="hud-nav-badge brass tabular" id="top-badge-score">50%</span>
        </button>
        <button type="button" class="hud-nav-btn" data-tab="prayers">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 2.2c2 1.8 3.4 3.5 3.4 5.2v2h2.4v6.4H3.2V9.4h2.4v-2C5.6 5.7 7 4 9 2.2z"/><path d="M7.4 15.8v-3.2a1.6 1.6 0 0 1 3.2 0v3.2" stroke-linecap="round"/></svg>
          <span>Prayers</span>
          <span class="hud-nav-badge steel tabular" id="top-badge-prayers">--:--</span>
        </button>
      </nav>

      <div class="hud-right">
        <button type="button" class="hud-prayer-pill" id="btn-prayer-hud" title="Open Shia Prayer Times (Fajr, Dohor, Maghrib) &amp; Location Alerts">
          <span class="prayer-hud-icon" id="prayer-hud-icon">🕌</span>
          <span class="prayer-hud-name" id="prayer-hud-name">Prayer</span>
          <strong class="prayer-hud-time tabular" id="prayer-hud-time">--:--</strong>
          <span class="prayer-hud-cd tabular" id="prayer-hud-cd"></span>
        </button>
        <button type="button" class="hud-sync-pill" id="btn-sync-now" title="Sync with Cloud Relay &amp; Workstation Bridge">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-label">Sync</span>
        </button>
        <button type="button" class="hud-icon-btn" id="btn-theme-toggle" title="Toggle Dark / Light Theme" aria-label="Toggle Theme">
          <svg viewBox="0 0 20 20"><path d="M10 3a7 7 0 1 0 7 7c0-.4-.04-.8-.1-1.2A5.5 5.5 0 0 1 11.2 3.1C10.8 3.04 10.4 3 10 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <a href="https://husseinbdeir.github.io/theo/" target="_blank" rel="noopener" class="hud-theo-link" id="link-theo-workbench" title="Open THEO AI Session Workbench (separate PWA)">
          <span>THEO</span>
          <svg viewBox="0 0 14 14"><path d="M4 10l6-6M5 4h5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button type="button" class="hud-icon-btn hud-notif-btn" id="btn-push-toggle" title="Notifications &amp; Lock-Screen Push Settings" aria-label="Notifications">
          <svg viewBox="0 0 20 20"><path d="M10 2.5a5 5 0 0 0-5 5v2.8l-1.6 2.4a.6.6 0 0 0 .5.9h12.2a.6.6 0 0 0 .5-.9L15 10.3V7.5a5 5 0 0 0-5-5zm-1.8 13a1.8 1.8 0 0 0 3.6 0" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="push-dot" id="push-dot" hidden></span>
          <span class="push-count-badge tabular" id="push-count-badge" hidden>0</span>
        </button>
      </div>
    </header>

    <!-- Pinned Executive Command, Planning & Delegation Bar -->
    <section class="capture-bar-wrap" id="capture-bar-wrap">
      <form class="capture-form" id="capture-form" autocomplete="off">
        <div class="capture-input-shell">
          <span class="capture-spark" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M9 3.5v11M3.5 9h11"/></svg>
          </span>
          <input
            type="text"
            id="capture-input"
            class="capture-input"
            placeholder="Plan an objective, schedule a task, @Name to delegate, or set a $ hold / wait timer…"
          >
          <div class="capture-meta-controls">
            <button type="button" class="capture-meta-pill" id="btn-draft-horizon" title="Set planning horizon (Today, Tomorrow, This Week, Wait Timer, Backlog)">
              <span id="draft-horizon-label">Horizon: Auto</span>
            </button>
            <button type="button" class="capture-meta-pill" id="btn-draft-priority" title="Cycle priority (Normal, P2 High, P1 Critical)">
              <span id="draft-priority-label">P3 Normal</span>
            </button>
            <div class="capture-delegate-group" id="capture-delegate-group">
              <button type="button" class="capture-delegate-btn" id="btn-pick-assignee" title="Delegate task to a team member">
                <svg class="del-btn-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="5.2" r="2.2"/><path d="M2 13c0-2 1.8-3.5 4-3.5s4 1.5 4 3.5"/><path d="M12.5 5.5v4M10.5 7.5h4"/></svg>
                <span id="capture-assignee-icon" hidden></span>
                <span id="capture-assignee-label">Delegate</span>
              </button>
              <button type="button" class="capture-delegate-clear" id="btn-clear-assignee" title="Clear selected person" aria-label="Clear assignee" hidden>✕</button>
            </div>
          </div>
        </div>
        <button type="submit" class="capture-submit-btn" id="capture-submit-btn">+ Add Plan</button>
      </form>

      <!-- Collapsible Live Executive Planner & Classifier Drawer -->
      <div class="live-advisor-drawer" id="live-advisor-drawer" hidden></div>

      <!-- Compact 1-Tap Device Push Activation Banner (Only shown when this device has not armed Planner Push yet) -->
      <div class="planner-push-banner" id="planner-push-banner" hidden>
        <div class="planner-push-banner-copy">
          <svg class="push-banner-svg" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><path d="M9 2.2a4.5 4.5 0 0 0-4.5 4.5v2.5L3 11.4a.5.5 0 0 0 .4.8h11.2a.5.5 0 0 0 .4-.8l-1.5-2.2V6.7A4.5 4.5 0 0 0 9 2.2zm-1.6 12a1.6 1.6 0 0 0 3.2 0"/></svg>
          <span><strong>Enable Planner Push on this device</strong> — lock-screen alerts for Prayer Times, Tasks, Wait Timers &amp; Staff Delegations</span>
        </div>
        <div class="planner-push-banner-actions">
          <button type="button" class="planner-push-activate-btn" id="btn-banner-enable-push">Enable Push</button>
          <button type="button" class="planner-push-center-btn" id="btn-banner-notif-center" title="Open Notification Control Center" aria-label="Notification Settings">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v1.6M8 12.4V14M2 8h1.6M12.4 8H14M3.8 3.8l1.1 1.1M11.1 11.1l1.1 1.1M12.2 3.8l-1.1 1.1M4.9 11.1l-1.1 1.1" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Main Viewport Stage (5 Dedicated Pillars) -->
    <main class="cmd-stage" id="cmd-stage">
      <!-- TAB 1: PLANNING (Horizon Agenda, 2x4 Executive Command Matrix, BHFIRMS BUs & Sub-Topic Register) -->
      <section class="cmd-view active" id="view-planning" data-view="planning"></section>

      <!-- TAB 2: TASKS (All Active Tasks, Ready Now, Wait Timers, Verify, Shipping, Payment Holds, Recurring, Ideas) -->
      <section class="cmd-view" id="view-tasks" data-view="tasks" hidden></section>

      <!-- TAB 3: DELEGATION (BHFIRMS Organizational Delegation Studio, 4-Stage Pipeline & Team Workload Matrix) -->
      <section class="cmd-view" id="view-delegated" data-view="delegated" hidden></section>

      <!-- TAB 4: THE SCORE (Daily 100-Point Personal Discipline Ledger — 5 Do's & 5 Don'ts starting at 50% + 7-Day Trend) -->
      <section class="cmd-view" id="view-score" data-view="score" hidden></section>

      <!-- TAB 5: PRAYING TIMES (Dedicated Shia Ja'fari Astronomical Prayer Times — Fajr, Dohor, Maghrib, GPS & 7-Day Schedule) -->
      <section class="cmd-view" id="view-prayers" data-view="prayers" hidden></section>
    </main>

    <!-- Mobile / Standalone 5-Tab Bottom Navigation Dock -->
    <nav class="cmd-bottom-dock" id="cmd-bottom-dock" aria-label="Primary Command Navigation">
      <button type="button" class="cmd-dock-btn active" data-tab="planning">
        <svg viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.65"/><rect x="11" y="2.5" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.65"/><rect x="2.5" y="11" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.65"/><rect x="11" y="11" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.65"/></svg>
        <span>Planning</span>
        <span class="dock-pill brass tabular" id="dock-badge-planning" hidden>0</span>
      </button>
      <button type="button" class="cmd-dock-btn" data-tab="delegated">
        <svg viewBox="0 0 20 20"><circle cx="7.5" cy="6.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.65"/><path d="M2.5 16c0-2.6 2.2-4.5 5-4.5s5 1.9 5 4.5" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/><circle cx="14.2" cy="7.2" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 11.8c2.2.3 4 1.8 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Delegation</span>
        <span class="dock-pill emerald tabular" id="dock-badge-delegated" hidden>0</span>
      </button>
      <button type="button" class="cmd-dock-btn" data-tab="tasks">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10.5" r="6.8" fill="none" stroke="currentColor" stroke-width="1.65"/><path d="M10 6.8v3.9l2.6 1.8M7.5 2.2h5" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></svg>
        <span>Tasks</span>
        <span class="dock-pill amber tabular" id="dock-badge-tasks" hidden>0</span>
      </button>
      <button type="button" class="cmd-dock-btn" data-tab="score">
        <svg viewBox="0 0 20 20"><path d="M10 2.5l6 2.5v4.8c0 4.2-2.6 6.9-6 8.2-3.4-1.3-6-4-6-8.2V5l6-2.5z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><path d="M7.3 10.2l1.9 1.9 3.6-3.7" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>The Score</span>
        <span class="dock-pill brass tabular" id="dock-badge-score">50%</span>
      </button>
      <button type="button" class="cmd-dock-btn" data-tab="prayers">
        <svg viewBox="0 0 20 20"><path d="M10 2.5c2.2 2 3.8 3.9 3.8 5.8v2.2h2.7v7H3.5v-7h2.7V8.3C6.2 6.4 7.8 4.5 10 2.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.2 17.5v-3.6a1.8 1.8 0 0 1 3.6 0v3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Prayers</span>
        <span class="dock-pill steel tabular" id="dock-badge-prayers">--:--</span>
      </button>
    </nav>
  </div>

  <!-- Slide-Up / Centered Executive Sheet Modal (Task Workbench, Cluster Drilldown, Roster & Notifications) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <div class="sheet-dialog" id="sheet-dialog">
      <div class="sheet-header">
        <div class="sheet-title-wrap" id="sheet-title-wrap"></div>
        <button type="button" class="sheet-close-btn" id="sheet-close-btn" aria-label="Close">✕</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <!-- Toast Stack -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="js/endpoints.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
</body>
</html>
